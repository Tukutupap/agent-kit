# Keeps the GitHub Actions used by this project's workflows current, including
# the agent kit's checks, so a new kit version arrives as a pull request.
# Add the project's own package ecosystems below.
# The kit has no npm dependencies. The setup-node version inside
# checks/*/action.yml is updated by hand, because Dependabot only reads
# .github/workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: Update
