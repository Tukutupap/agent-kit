name: CI

# The kit's own tests: the scripts, the template rendered with Copier and
# checked with the kit's own checks, and the plugin manifests. The released
# checks run from knowledge.yml and pr-format.yml, as in any project.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Copier renders from git, so it needs the history and tags.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Copier
        run: pip install 'copier>=9.4,<10'

      - name: Run the tests
        run: node --test tests/*.test.mjs
        env:
          REQUIRE_COPIER: 'true'

  knowledge:
    name: Knowledge check from this branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # This branch's check on the kit's own knowledge/, so a change to the
      # check is tried here before it's released.
      - uses: ./checks/knowledge
